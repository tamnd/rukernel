# Linux, hardware and tool names that the spelling check reads as mistakes.

[files]
# The generated ABI has the names of Linux, for example `creat`. The fstests tables copy the
# descriptions of the tests from fstests as they are, and the LTP tables copy them from LTP.
extend-exclude = [
    "LICENSE",
    "abi/",
    "core/rk-abi/src/generated/",
    "tools/fstests/ext4.md",
    "tools/fstests/overlay.md",
    "tools/ltp/syscalls.md",
    "tools/ltp/mm.md",
    "tools/ltp/sched.md",
    "tools/ltp/net.md",
]

[default.extend-words]
AER = "AER"       # PCIe Advanced Error Reporting
SME = "SME"       # AMD Secure Memory Encryption, Arm Scalable Matrix Extension
SEH = "SEH"       # Windows structured exception handling
HDA = "HDA"       # Intel High Definition Audio
CNA = "CNA"       # CVE Numbering Authority
RTO = "RTO"       # TCP retransmission timeout
DEFIN = "DEFIN"   # BPF_CORE_TYPE_DEFINED and similar, split by the checker
Veru = "Veru"     # VeruSAGE
wrk = "wrk"       # the HTTP benchmark tool
passt = "passt"   # the user mode network stack of Podman
IST = "IST"       # the x86-64 Interrupt Stack Table
controllen = "controllen" # msg_controllen of struct msghdr
BA = "BA"         # BARs, PCI base address registers, split by the checker
exportfs = "exportfs" # the NFS export code of Linux and the group of fstests
IIF = "IIF"       # RTA_IIF of rtnetlink, the input interface of a route
OIF = "OIF"       # RTA_OIF of rtnetlink, the output interface of a route
Parm = "Parm"     # InParmProbs of /proc/net/snmp, the ICMP parameter problems
Ofo = "Ofo"       # OfoPruned of /proc/net/netstat, the out of order queue of TCP
ECT = "ECT"       # InECT0Pkts of /proc/net/netstat, the ECN capable transport
ND = "ND"         # ND_OPT_* of IPv6 neighbour discovery, RFC 4861
