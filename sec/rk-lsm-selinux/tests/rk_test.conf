# The test policy of the unit tests of rk-lsm-selinux.
# Make rk_test.33.bin with checkpolicy -M -c 33 -o rk_test.33.bin rk_test.conf, and rk_test.35.bin with -c 35.
# Version 24 has no extended permissions. Make version 33 from this file without the allowxperm line, then make rk_test.24.bin from it with checkpolicy -M -b -c 24. checkpolicy drops the role_transition rules when it writes version 24 from the text directly.

class security
class process
class system
class capability
class filesystem
class file
class dir
class fd
class lnk_file
class chr_file
class blk_file
class sock_file
class fifo_file

sid kernel
sid security
sid unlabeled
sid fs
sid file
sid file_labels
sid init
sid any_socket
sid port
sid netif
sid netmsg
sid node
sid igmp_packet
sid icmp_socket
sid tcp_socket
sid sysctl_modprobe
sid sysctl
sid sysctl_fs
sid sysctl_kernel
sid sysctl_net
sid sysctl_net_unix
sid sysctl_vm
sid sysctl_dev
sid kmod
sid policy
sid scmp_packet
sid devnull

common file { ioctl read write create getattr setattr lock relabelfrom relabelto append map unlink link rename execute quotaon mounton audit_access open execmod watch watch_mount watch_sb watch_with_perm watch_reads }

class security { compute_av compute_create compute_member check_context load_policy compute_relabel compute_user setenforce setbool setsecparam setcheckreqprot read_policy validate_trans }
class process { fork transition sigchld sigkill sigstop signull signal ptrace getsched setsched getsession getpgid setpgid getcap setcap share getattr setexec setfscreate noatsecure siginh setrlimit rlimitinh dyntransition setcurrent execmem execstack execheap setkeycreate setsockcreate getrlimit }
class system { ipc_info syslog_read syslog_mod syslog_console module_request module_load firmware_load kexec_image_load kexec_initramfs_load policy_load x509_certificate_load }
class capability { chown dac_override dac_read_search fowner fsetid kill setgid setuid setpcap linux_immutable net_bind_service net_broadcast net_admin net_raw ipc_lock ipc_owner sys_module sys_rawio sys_chroot sys_ptrace sys_pacct sys_admin sys_boot sys_nice sys_resource sys_time sys_tty_config mknod lease audit_write audit_control setfcap }
class filesystem { mount remount unmount getattr relabelfrom relabelto associate quotamod quotaget watch }
class file inherits file { execute_no_trans entrypoint }
class dir inherits file { add_name remove_name reparent search rmdir }
class fd { use }
class lnk_file inherits file
class chr_file inherits file
class blk_file inherits file
class sock_file inherits file
class fifo_file inherits file

default_user process source;
default_role process source;
default_type dir target;
default_range file target low;

sensitivity s0;
sensitivity s1 alias s1a;
dominance { s0 s1 }
category c0;
category c1;
category c2 alias cx;
level s0:c0.c2;
level s1:c0.c2;

mlsconstrain process { transition dyntransition } (h1 dom h2);
mlsconstrain file { read } (l1 dom l2 or t1 == mlsfilereadtoclr);
mlsvalidatetrans file (l1 eq l2 or t3 == mlsfileupgrade);

policycap network_peer_controls;
policycap open_perms;
policycap extended_socket_class;
policycap genfs_seclabel_symlinks;

attribute domain;
attribute file_type;
attribute mlsfilereadtoclr;
attribute mlsfileupgrade;

bool secure_mode false;
bool allow_exec true;

type kernel_t, domain;
type init_t, domain, mlsfilereadtoclr;
type init_exec_t, file_type;
type unconfined_t, domain;
type child_t;
typebounds unconfined_t child_t;
type bin_t alias sbin_t, file_type;
type etc_t, file_type;
type tmpfs_t, file_type;
type sysfs_t, file_type;
type proc_t, file_type;
type security_t, file_type;
type unlabeled_t, file_type;
type fs_t;
type devnull_t, file_type;

permissive unconfined_t;

allow domain file_type : file { read getattr open execute };
allow domain file_type : dir { search getattr open read };
allow kernel_t init_t : process transition;
allow init_t init_exec_t : file entrypoint;
allow domain self : process { fork sigchld signal };
auditallow init_t etc_t : file write;
dontaudit init_t proc_t : file write;
allowxperm domain file_type : file ioctl { 0x8910 0x8912-0x8920 };
type_transition kernel_t init_exec_t : process init_t;
type_transition init_t tmpfs_t : file etc_t;
type_transition init_t tmpfs_t : dir bin_t "named";
type_member init_t tmpfs_t : dir tmpfs_t;
type_change init_t etc_t : file bin_t;
range_transition kernel_t init_exec_t : process s0 - s1:c0.c2;

if (allow_exec) {
	allow init_t bin_t : file execute_no_trans;
} else {
	dontaudit init_t bin_t : file execute_no_trans;
}
if (!secure_mode && allow_exec) {
	allow init_t self : process execmem;
}

role system_r;
role system_r types { kernel_t init_t unconfined_t };
role user_r;
role user_r types unconfined_t;
allow system_r user_r;
role_transition system_r init_exec_t : process user_r;

user system_u roles { system_r } level s0 range s0 - s1:c0.c2;
user user_u roles { user_r } level s0 range s0;

constrain process transition (u1 == u2 or t1 == domain);
constrain file { write } (r1 == r2 or t1 != init_t);

sid kernel system_u:system_r:kernel_t:s0 - s1:c0.c2
sid security system_u:object_r:security_t:s0
sid unlabeled system_u:object_r:unlabeled_t:s0
sid fs system_u:object_r:fs_t:s0
sid file system_u:object_r:unlabeled_t:s0
sid init system_u:system_r:init_t:s0
sid devnull system_u:object_r:devnull_t:s0

fs_use_xattr ext4 system_u:object_r:fs_t:s0;
fs_use_xattr xfs system_u:object_r:fs_t:s0;
fs_use_task pipefs system_u:object_r:fs_t:s0;
fs_use_trans tmpfs system_u:object_r:tmpfs_t:s0;
fs_use_trans devpts system_u:object_r:tmpfs_t:s0;

genfscon proc / system_u:object_r:proc_t:s0
genfscon proc /sys system_u:object_r:sysfs_t:s0
genfscon proc /kmsg -- system_u:object_r:etc_t:s1
genfscon sysfs / system_u:object_r:sysfs_t:s0
genfscon selinuxfs / system_u:object_r:security_t:s0

portcon tcp 22 system_u:object_r:etc_t:s0
portcon udp 1000-2000 system_u:object_r:etc_t:s0

netifcon eth0 system_u:object_r:etc_t:s0 system_u:object_r:unlabeled_t:s0

nodecon 127.0.0.1 255.255.255.255 system_u:object_r:etc_t:s0
nodecon ::1 ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff system_u:object_r:etc_t:s0
