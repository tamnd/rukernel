# The kernel builds with stable Rust only, per spec/03-architecture.md section 3.9. The version is
# pinned. A new clippy or rustfmt release must not change a green CI to red. To move the version,
# make a commit that changes this file and the rust-version in Cargo.toml.
[toolchain]
channel = "1.98.0"
components = ["rustfmt", "clippy", "rust-src"]
targets = ["x86_64-unknown-none", "aarch64-unknown-none", "riscv64gc-unknown-none-elf"]
profile = "minimal"
