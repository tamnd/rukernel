[workspace]
resolver = "3"
members = [
    "frame/rk-frame",
    "core/rk-abi",
    "block/rk-block",
    "core/rk-lib",
    "core/rk-mm",
    "core/rk-sched",
    "core/rk-cgroup",
    "core/rk-proc",
    "core/rk-syscall",
    "drv/rk-drv-mem",
    "drv/rk-drv-virtio",
    "drv/rk-drv-tty",
    "fs/rk-vfs",
    "fs/rk-fs-proc",
    "fs/rk-fs-sys",
    "fs/rk-fs-cgroup",
    "fs/rk-fs-overlay",
    "fs/rk-fs-ext4",
    "fs/rk-fs-hugetlbfs",
    "fs/rk-fs-tmpfs",
    "fs/rk-fs-xfs",
    "kernel/rukernel",
    "net/rk-net",
    "net/rk-net-inet",
    "net/rk-net-unix",
    "tools/rk-abigen",
    "xtask",
]

[workspace.package]
version = "0.4.12"
edition = "2024"
rust-version = "1.98.0"
license = "GPL-2.0-only"
repository = "https://github.com/tamnd/rukernel"
homepage = "https://github.com/tamnd/rukernel/tree/main/spec"
authors = ["tamnd <tamnd87@gmail.com>"]
publish = true

# The crates of the kernel. Each crate uses `{ workspace = true }`, so that one line here sets the
# path for all users. crates.io needs the version too. The version here must be the same as the
# workspace version, and the release gate checks it.
[workspace.dependencies]
rk-frame = { path = "frame/rk-frame", version = "0.4.1" }
rk-abi = { path = "core/rk-abi", version = "0.4.1" }
rk-lib = { path = "core/rk-lib", version = "0.4.1" }
rk-mm = { path = "core/rk-mm", version = "0.4.1" }
rk-sched = { path = "core/rk-sched", version = "0.4.1" }
rk-cgroup = { path = "core/rk-cgroup", version = "0.4.1" }
rk-proc = { path = "core/rk-proc", version = "0.4.1" }
rk-syscall = { path = "core/rk-syscall", version = "0.4.1" }
rk-block = { path = "block/rk-block", version = "0.4.1" }
rk-drv-mem = { path = "drv/rk-drv-mem", version = "0.4.1" }
rk-drv-virtio = { path = "drv/rk-drv-virtio", version = "0.4.1" }
rk-drv-tty = { path = "drv/rk-drv-tty", version = "0.4.1" }
rk-vfs = { path = "fs/rk-vfs", version = "0.4.1" }
rk-fs-proc = { path = "fs/rk-fs-proc", version = "0.4.1" }
rk-fs-sys = { path = "fs/rk-fs-sys", version = "0.4.1" }
rk-fs-cgroup = { path = "fs/rk-fs-cgroup", version = "0.4.1" }
rk-fs-overlay = { path = "fs/rk-fs-overlay", version = "0.4.1" }
rk-fs-ext4 = { path = "fs/rk-fs-ext4", version = "0.4.1" }
rk-fs-hugetlbfs = { path = "fs/rk-fs-hugetlbfs", version = "0.4.1" }
rk-fs-tmpfs = { path = "fs/rk-fs-tmpfs", version = "0.4.1" }
rk-fs-xfs = { path = "fs/rk-fs-xfs", version = "0.4.1" }
rk-net = { path = "net/rk-net", version = "0.4.1" }
rk-net-inet = { path = "net/rk-net-inet", version = "0.4.1" }
rk-net-unix = { path = "net/rk-net-unix", version = "0.4.1" }
zerocopy = { version = "0.8.63", default-features = false, features = ["derive"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
# Each unsafe block in rk-frame tells why it is sound, per spec/03-architecture.md section 3.1.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
# A kernel cannot stop on an unexpected value. These lints find the places that can.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
debug = "line-tables-only"
codegen-units = 1
# Thin LTO lets the code of one crate inline into another. On QEMU TCG it makes the system call
# rows of tools/bench 15 to 40 percent faster, and the build takes about the same time. Fat LTO
# is up to 20 percent faster again on some rows, but a rebuild takes 2 times longer (#401).
lto = "thin"
