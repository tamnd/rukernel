# The release workflow. A signed tag `vX.Y.Z` on main starts it.
#
# The workflow runs the full gate again on the tag, makes a source archive, makes a build provenance
# attestation for the archive, publishes a GitHub release and publishes the crates to crates.io. Anybody can verify the archive with
# `gh attestation verify rukernel-X.Y.Z.tar.gz --repo tamnd/rukernel`.
#
# The release job uses no cache. A cache that a pull request wrote must not go into a release.

name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  gate:
    name: full gate on the tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the version in Cargo.toml agrees with the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$TAG" ]; then
            echo "Cargo.toml has $version and the tag is $TAG"
            exit 1
          fi
          if grep -A10 '^\[workspace.dependencies\]' Cargo.toml | grep 'version = ' | grep -v "\"$version\""; then
            echo "each path dependency in [workspace.dependencies] must have version $version"
            exit 1
          fi
      - name: install qemu and ovmf
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends qemu-system-x86 ovmf
      - name: cargo xtask ci
        run: cargo xtask ci
      - name: the crates package and build alone
        run: cargo publish --workspace --dry-run --locked

  publish:
    name: archive, attest and publish
    needs: gate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: make the source archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          name="rukernel-${TAG#v}"
          git archive --format=tar --prefix="$name/" "$TAG" | gzip -n -9 > "$name.tar.gz"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          cat "$name.tar.gz.sha256"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: rukernel-*.tar.gz
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # A maintainer can publish the release notes before this job runs. Then the job only
          # adds the archive and the checksum to that release.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" rukernel-*.tar.gz rukernel-*.tar.gz.sha256 \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" rukernel-*.tar.gz rukernel-*.tar.gz.sha256 \
              --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "rukernel $TAG"
          fi

  # The crates go to crates.io after the gate passes. The job uses the environment `crates-io`. The
  # secret CARGO_REGISTRY_TOKEN in that environment is a crates.io token with the publish-new and
  # publish-update scopes. Without the secret, the job writes a warning and publishes nothing.
  #
  # crates.io limits the rate of publishes. The script waits and tries again when crates.io refuses a
  # publish for the rate, so this job can take some time for new crates.
  crates:
    name: publish to crates.io
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: crates-io
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: publish the crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::the environment crates-io has no CARGO_REGISTRY_TOKEN, so no crate is published"
            exit 0
          fi
          # Each crate comes after the crates that it depends on.
          .github/scripts/publish-crates.sh rk-abi rk-frame rk-lib rk-mm rk-sched rukernel
