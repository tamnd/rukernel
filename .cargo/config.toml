# `cargo xtask <task>` runs the build checks, per spec/23-package-layout.md.
[alias]
xtask = "run --quiet --package xtask --"

# The kernel runs at the top 2 GiB of the address space, so it uses the kernel code model and no
# position independent code, as Linux does.
[target.x86_64-unknown-none]
rustflags = ["-C", "code-model=kernel", "-C", "relocation-model=static"]
